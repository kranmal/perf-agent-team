<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perf Console</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f9fafb;--line:#e3e6eb;--text:#161a22;--muted:#667085;--faint:#98a2b3;
  --accent:#3b5bdb;--accent-soft:#e8edff;--ok:#127a3f;--ok-soft:#e3f6ea;--bad:#b42318;--bad-soft:#fde8e6;--warn:#a15c07;--warn-soft:#fdf1dc;
  --c1:#3b5bdb;--c2:#0e9384;--c3:#d9730d;--c4:#8a4fd1;--shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1116;--panel:#161b22;--panel2:#1b2129;--line:#262d37;--text:#e6e9ef;--muted:#9aa4b2;--faint:#6b7685;
  --accent:#7c93ff;--accent-soft:#222c52;--ok:#4cc38a;--ok-soft:#14301f;--bad:#ff8a80;--bad-soft:#3a1a18;--warn:#f2b45a;--warn-soft:#3a2b10;
  --c1:#7c93ff;--c2:#3fc4b4;--c3:#f0993f;--c4:#b58bef;--shadow:none}}
:root[data-theme=dark]{--bg:#0e1116;--panel:#161b22;--panel2:#1b2129;--line:#262d37;--text:#e6e9ef;--muted:#9aa4b2;--faint:#6b7685;--accent:#7c93ff;--accent-soft:#222c52;--ok:#4cc38a;--ok-soft:#14301f;--bad:#ff8a80;--bad-soft:#3a1a18;--warn:#f2b45a;--warn-soft:#3a2b10;--c1:#7c93ff;--c2:#3fc4b4;--c3:#f0993f;--c4:#b58bef;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-weight:650;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav svg{width:17px;height:17px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--faint);padding:8px 10px}
main{padding:24px 32px 56px;max-width:1280px;width:100%}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:22px;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 2px;font-size:14px;font-weight:650}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.kpi .label{color:var(--muted);font-size:12.5px;font-weight:550}
.kpi .value{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .foot{font-size:12.5px;color:var(--muted)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--panel2)}
.scroll{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
.bar{height:8px;border-radius:99px;background:var(--panel2);position:relative;overflow:visible;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c1)}
.bar b{position:absolute;top:-4px;width:2px;height:14px;background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--k,var(--c1));vertical-align:-1px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.callout{padding:11px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;margin-bottom:14px}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.finding{padding:12px 0;border-bottom:1px solid var(--line)}.finding:last-child{border-bottom:0}
.finding .area{font-weight:650}.finding .ev{color:var(--muted);font-size:12.5px}
.console{background:#0b0e13;color:#d6dbe4;border-radius:10px;padding:12px 14px;font:12.5px/1.55 ui-monospace,Menlo,monospace;height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.md h1,.md h2,.md h3{letter-spacing:-.01em}.md h2{font-size:17px;margin:22px 0 6px}.md h3{font-size:14.5px}.md code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12.5px}.md p,.md li{max-width:80ch}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;z-index:9;display:none;white-space:pre}
iframe.pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;background:#fff}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav{flex-direction:row;flex-wrap:wrap}.side-foot,.brand{display:none}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>Perf Console</div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot"><div id="job-mini"></div><button class="btn" id="theme" style="margin-top:10px;width:100%;justify-content:center">Toggle theme</button></div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<div class="tip" id="tip"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ms = (v) => v == null ? '–' : v >= 1000 ? (v / 1000).toFixed(2) + ' s' : v >= 100 ? Math.round(v) + ' ms' : v.toFixed(v < 10 ? 1 : 0) + ' ms';
const pct = (v) => v == null ? '–' : (v * 100).toFixed(v === 0 ? 0 : 2) + '%';
const num = (v, d = 1) => v == null ? '–' : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
const when = (iso) => { try { return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };
const badge = (ok, yes = 'Pass', no = 'Fail') => ok == null ? '<span class="pill">n/a</span>' : `<span class="pill ${ok ? 'ok' : 'bad'}"><span class="dot"></span>${ok ? yes : no}</span>`;
const I = { overview: 'M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z', load: 'M3 12h4l3-8 4 16 3-8h4', browser: 'M3 5h18v14H3zM3 9h18', strategy: 'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5', reports: 'M6 3h9l4 4v14H6zM14 3v5h5', run: 'M6 4l14 8-14 8z' };
const ico = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${I[k]}"/></svg>`;
const TABS = [['overview', 'Overview'], ['load', 'Load tests'], ['browser', 'Browser'], ['strategy', 'Strategy'], ['reports', 'Reports'], ['run', 'Run']];
// Browser-side SLOs from the approved strategy
const SLO = { lcp: 2500, tbt: 200, cls: 0.1, heapMB: 100 };

let S = null, tab = location.hash.slice(1) || 'overview', sel = null, consoleLines = [];

async function load() { S = await (await fetch('/api/state')).json(); if (S.job?.log && !consoleLines.length) consoleLines = S.job.log.slice(); render(); }
function render() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" ${k === tab ? 'aria-current="page"' : ''}>${ico(k)}${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b) => b.onclick = () => { tab = b.dataset.t; location.hash = tab; render(); });
  const j = S.job; $('#job-mini').innerHTML = j?.running ? `<span class="pill warn"><span class="dot"></span>Running ${esc(j.label)}</span>` : '';
  $('#view').innerHTML = ({ overview, load: loadTests, browser, strategy, reports, run })[tab]();
  after();
}
function head(title, sub, right = '') { return `<header class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="row">${right}</div></header>`; }
const target = () => S.config.baseUrl || '';
const latestBy = () => { const m = {}; for (const r of S.runs) if (!m[r.profile]) m[r.profile] = r; return m; };

// ---------- charts ----------
function lineChart({ series, xs, w = 560, h = 240, log = false, fmtY = ms, fmtX = (x) => x, slo }) {
  const pad = { l: 56, r: 14, t: 12, b: 30 }, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const all = series.flatMap((s) => s.data).filter((v) => v != null && v > 0), hi = Math.max(...all, slo || 0) * 1.12, lo = log ? Math.max(Math.min(...all) / 1.5, 0.1) : 0;
  const sy = (v) => pad.t + ih - (log ? (Math.log10(v) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)) : (v - lo) / (hi - lo)) * ih;
  const sx = (i) => pad.l + (xs.length === 1 ? iw / 2 : (i / (xs.length - 1)) * iw);
  const ticks = log ? [...Array(6)].map((_, i) => lo * Math.pow(hi / lo, i / 5)).map((v) => Math.pow(10, Math.round(Math.log10(v) * 2) / 2)) : [...Array(5)].map((_, i) => lo + ((hi - lo) * i) / 4);
  let g = [...new Set(ticks.map((t) => +t.toPrecision(2)))].map((t) => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)"/><text x="${pad.l - 8}" y="${sy(t) + 4}" text-anchor="end">${fmtY(t)}</text>`).join('');
  g += xs.map((x, i) => `<text x="${sx(i)}" y="${h - 9}" text-anchor="middle">${esc(fmtX(x))}</text>`).join('');
  if (slo) g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${sy(slo)}" y2="${sy(slo)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="${w - pad.r}" y="${sy(slo) - 5}" text-anchor="end" style="fill:var(--bad)">SLO ${fmtY(slo)}</text>`;
  g += series.map((s, k) => {
    const pts = s.data.map((v, i) => v == null || v <= 0 ? null : [sx(i), sy(v), v, i]).filter(Boolean);
    const col = `var(--c${k + 1})`;
    return `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>` +
      pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${col}" stroke="var(--panel)" stroke-width="2" data-tip="${esc(s.name)} @ ${esc(fmtX(xs[p[3]]))}\n${esc(fmtY(p[2]))}"/>`).join('');
  }).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map((s, k) => `<span style="--k:var(--c${k + 1})">${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="chart">${g}</svg>${legend}`;
}

// ---------- views ----------
function overview() {
  const L = latestBy(), load = L.load, smoke = L.smoke, b = S.browser, cold = b['cold-load']?.variants?.find((v) => /phone.*blocked/.test(v.variant));
  const ranked = Object.values(L).filter((r) => r.gated !== false && r.passed != null);
  const allPass = ranked.length ? ranked.every((r) => r.passed) : null;
  const lcp = cold?.summary.lcp.median;
  const bl = S.baseline?.latest?.load;
  const delta = load && bl ? ((load.p95 - bl.p95) / bl.p95) * 100 : null;
  if (!S.runs.length && !Object.keys(b).length) return head(S.project, 'No results yet') + `<div class="card empty">Nothing has been run. Open <b>Run</b> and start a smoke test.</div>`;
  const kpi = (label, value, unit, foot) => `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}<small>${unit || ''}</small></div><div class="foot">${foot || ''}</div></div>`;
  const trend = S.runs.filter((r) => r.profile === 'load').slice().reverse();
  const eps = load?.endpoints || [];
  return head(S.project, `Target <span class="mono">${esc(target())}</span> · last run ${load ? when(load.at) : '–'}`,
    `${badge(allPass, 'All SLOs met', 'SLO breach')}<button class="btn primary" data-go="run">Run tests</button>`) +
    `<div class="callout info">Indicative results: load generator and target share one laptop. Treat numbers as relative, not capacity guarantees.</div>` +
    `<div class="grid kpis">` +
    kpi('Load p95 latency', load ? ms(load.p95).replace(/ (ms|s)$/, '') : '–', load ? (load.p95 >= 1000 ? 's' : 'ms') : '', load ? `SLO ${ms(S.config.defaultSlo.p95Ms)} · p99 ${ms(load.p99)}` : 'run a load test') +
    kpi('Error rate', load ? pct(load.errorRate) : '–', '', load ? `SLO < ${pct(S.config.defaultSlo.errorRate)}` : '') +
    kpi('Throughput', load ? num(load.rps, 0) : '–', 'req/s', load ? `${num(load.vusMax, 0)} virtual users, ${num(load.requests, 0)} requests` : '') +
    kpi('Cold-load LCP (phone)', lcp != null ? (lcp / 1000).toFixed(2) : '–', lcp != null ? 's' : '', lcp != null ? `SLO ${SLO.lcp / 1000} s · 4x CPU, slow 4G` : 'run browser tests') +
    kpi('Vs. baseline', delta == null ? '–' : (delta > 0 ? '+' : '') + delta.toFixed(0), delta == null ? '' : '% p95', delta == null ? 'accept a baseline' : delta > S.config.regressionTolerance.p95Pct ? 'Regression beyond tolerance' : 'Within tolerance') +
    `</div><div class="grid cols2">` +
    `<div class="card"><h3>Latency by endpoint</h3><div class="hint">p95 from the latest load run; red tick marks the SLO.</div>${eps.length ? eps.map((e) => { const slo = parseSlo(e.threshold) || S.config.defaultSlo.p95Ms; const mx = Math.max(slo * 1.3, e.p95); return `<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><span><b>${esc(e.name)}</b> <span class="mono" style="color:var(--faint)">${esc(e.path)}</span></span><span>${ms(e.p95)} ${badge(e.ok)}</span></div><div class="bar" style="margin-top:7px"><i style="width:${Math.max(1, (e.p95 / mx) * 100)}%;background:${e.ok === false ? 'var(--bad)' : 'var(--c1)'}"></i><b style="left:${(slo / mx) * 100}%"></b></div></div>`; }).join('') : '<div class="empty">No endpoint data.</div>'}</div>` +
    `<div class="card"><h3>p95 over load runs</h3><div class="hint">${trend.length} run${trend.length === 1 ? '' : 's'}; dashed line is the SLO.</div>${trend.length ? lineChart({ series: [{ name: 'p95', data: trend.map((r) => r.p95) }, { name: 'p99', data: trend.map((r) => r.p99) }], xs: trend.map((r) => when(r.at)), slo: S.config.defaultSlo.p95Ms, w: 520, h: 230 }) : '<div class="empty">Run a load test.</div>'}</div></div>` +
    (S.analysis ? `<div class="card" style="margin-top:14px"><h3>Analysis</h3><div class="hint">From reports/analysis.md</div><div class="md">${md(S.analysis.slice(0, 2400))}</div><button class="btn" data-go="reports" style="margin-top:8px">Read full analysis</button></div>` : '');
}
function parseSlo(t) { const m = /<\s*([\d.]+)/.exec(t || ''); return m ? +m[1] : null; }

function loadTests() {
  if (!S.runs.length) return head('Load tests', 'k6 runs against ' + esc(target())) + '<div class="card empty">No k6 results yet.</div>';
  const cur = S.runs.find((r) => r.file === sel) || S.runs[0];
  const t = (r) => `<tr class="click" data-sel="${esc(r.file)}" ${r.file === cur.file ? 'style="background:var(--accent-soft)"' : ''}><td><b>${esc(r.profile)}</b></td><td>${when(r.at)}</td><td class="num">${num(r.vusMax, 0)}</td><td class="num">${ms(r.p95)}</td><td class="num">${ms(r.p99)}</td><td class="num">${pct(r.errorRate)}</td><td class="num">${num(r.rps, 1)}</td><td>${badge(r.passed)}</td></tr>`;
  const mx = Math.max(...['p50', 'p90', 'p95', 'p99', 'max'].map((k) => cur[k] || 0));
  return head('Load tests', 'k6 results, newest first', `<a class="btn" href="/files/results/${esc(cur.file)}" target="_blank">Raw JSON</a>`) +
    `<div class="card scroll"><table><thead><tr><th>Profile</th><th>When</th><th class="num">VUs</th><th class="num">p95</th><th class="num">p99</th><th class="num">Errors</th><th class="num">Req/s</th><th>Result</th></tr></thead><tbody>${S.runs.map(t).join('')}</tbody></table></div>` +
    `<div class="grid cols2" style="margin-top:14px"><div class="card"><h3>${esc(cur.profile)} · ${when(cur.at)}</h3><div class="hint">Latency distribution, all endpoints. ${num(cur.durationS, 0)} s, ${num(cur.requests, 0)} requests, ${num(cur.receivedMB, 1)} MB received.</div>` +
    ['p50', 'p90', 'p95', 'p99', 'max'].map((k) => `<div class="row" style="margin:10px 0"><span style="width:44px;color:var(--muted)">${k}</span><div class="bar" style="flex:1"><i style="width:${Math.max(1, ((cur[k] || 0) / mx) * 100)}%"></i></div><span style="width:70px;text-align:right">${ms(cur[k])}</span></div>`).join('') + `</div>` +
    `<div class="card"><h3>Thresholds</h3><div class="hint">Pass/fail criteria from the approved strategy.</div><div class="scroll"><table><tbody>${cur.thresholds.map((x) => `<tr><td class="mono">${esc(x.metric)}</td><td class="mono">${esc(x.expr)}</td><td>${badge(x.ok)}</td></tr>`).join('') || '<tr><td>None recorded (not gated).</td></tr>'}</tbody></table></div></div></div>` +
    `<div class="card scroll" style="margin-top:14px"><h3>Endpoints</h3><table><thead><tr><th>Endpoint</th><th class="num">p50</th><th class="num">p95</th><th class="num">p99</th><th class="num">max</th><th>SLO</th></tr></thead><tbody>${cur.endpoints.map((e) => `<tr><td><b>${esc(e.name)}</b> <span class="mono" style="color:var(--faint)">${esc(e.path)}</span></td><td class="num">${ms(e.p50)}</td><td class="num">${ms(e.p95)}</td><td class="num">${ms(e.p99)}</td><td class="num">${ms(e.max)}</td><td>${e.threshold ? `<span class="mono">${esc(e.threshold)}</span> ` : ''}${badge(e.ok)}</td></tr>`).join('')}</tbody></table></div>`;
}

function browser() {
  const b = S.browser, cold = b['cold-load'], scale = b['data-scale'], store = b['storage-limit'];
  if (!cold && !scale && !store) return head('Browser', 'Playwright measurements') + '<div class="card empty">No browser results yet. Start “Browser suite” from Run.</div>';
  let out = head('Browser', 'Real-browser measurements: client-side cost is where this app’s risk is');
  if (cold) out += `<div class="card scroll"><h3>Cold load</h3><div class="hint">Empty cache and storage per run. Median of ${cold.variants[0].reps}–${cold.variants.at(-1).reps} runs. SLOs: LCP &lt; ${SLO.lcp / 1000} s, TBT &lt; ${SLO.tbt} ms, CLS &lt; ${SLO.cls}.</div><table><thead><tr><th>Variant</th><th class="num">TTFB</th><th class="num">FCP</th><th class="num">LCP</th><th class="num">TBT</th><th class="num">CLS</th><th class="num">Requests</th><th class="num">Transfer</th><th>Verdict</th></tr></thead><tbody>${cold.variants.map((v) => { const s = v.summary, ok = s.lcp.median < SLO.lcp && s.tbt.median < SLO.tbt && s.cls.median < SLO.cls; return `<tr><td><b>${esc(v.variant)}</b></td><td class="num">${ms(s.ttfb.median)}</td><td class="num">${ms(s.fcp.median)}</td><td class="num">${ms(s.lcp.median)}</td><td class="num">${ms(s.tbt.median)}</td><td class="num">${s.cls.median}</td><td class="num">${s.requests.median}</td><td class="num">${num(s.ownKB.median, 0)} KB</td><td>${badge(ok)}</td></tr>`; }).join('')}</tbody></table></div>`;
  if (scale) {
    const sizes = scale.sizes, profs = [...new Set(scale.results.map((r) => r.profile))];
    const metric = (key) => profs.map((p) => ({ name: p, data: sizes.map((n) => scale.results.find((r) => r.profile === p && r.loans === n)?.summary?.[key]?.median ?? null) }));
    const chart = (title, hint, key, slo) => `<div class="card"><h3>${title}</h3><div class="hint">${hint}</div>${lineChart({ series: metric(key), xs: sizes, fmtX: (n) => n.toLocaleString(), log: true, slo, w: 520, h: 240 })}</div>`;
    out += `<div class="callout info" style="margin-top:14px">Data-scale test: localStorage is seeded with N loans (30% active) and interactions are timed under the profiles shown. Both axes are logarithmic.</div><div class="grid cols2">` +
      chart('Startup vs dataset size', 'Time until Home shows the right count', 'startupMs') + chart('Add a loan', 'Click “Log it” to updated Home', 'addLoanMs', 100) + chart('Mark returned', 'Click to updated Home', 'markReturnedMs', 100) + chart('Switch tab', 'Home to Items, two frames', 'itemsTabMs', 100) + `</div>` +
      `<div class="card scroll" style="margin-top:14px"><h3>Data-scale detail</h3><table><thead><tr><th>Profile</th><th class="num">Loans</th><th class="num">Storage</th><th class="num">Startup</th><th class="num">Items tab</th><th class="num">Add loan</th><th class="num">Returned</th><th class="num">Heap</th><th class="num">DOM nodes</th><th>Status</th></tr></thead><tbody>${scale.results.map((r) => { const s = r.summary; const c = (k, f = ms) => s[k] ? f(s[k].median) : '–'; return `<tr><td>${esc(r.profile)}</td><td class="num">${r.loans.toLocaleString()}</td><td class="num">${c('storageMB', (v) => v + ' MB')}</td><td class="num">${c('startupMs')}</td><td class="num">${c('itemsTabMs')}</td><td class="num">${c('addLoanMs')}</td><td class="num">${c('markReturnedMs')}</td><td class="num">${c('heapMB', (v) => v + ' MB')}</td><td class="num">${c('domNodes', (v) => num(v, 0))}</td><td>${r.error ? `<span class="pill bad" title="${esc(r.error)}">Failed</span>` : badge(!(s.addLoanMs && s.addLoanMs.median > 100) , 'OK', 'Slow')}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  if (store) out += `<div class="card" style="margin-top:14px"><h3>Storage limit</h3><div class="hint">localStorage quota probe and behaviour when it is full.</div><div class="row"><span class="pill">Quota ≈ ${num((store.quota?.acceptedChars || 0) / 1048576, 1)} M chars</span><span class="pill ${store.nearLimit?.persisted ? 'ok' : 'bad'}">${store.nearLimit?.persisted ? 'Write near limit persisted' : 'Write near limit lost'}</span>${(store.nearLimit?.errors || []).length ? `<span class="pill warn">${store.nearLimit.errors.length} console error(s)</span>` : ''}</div></div>`;
  return out;
}

function strategy() {
  const s = S.strategy;
  if (!s) return head('Strategy', '') + '<div class="card empty">No strategy/strategy.json found.</div>';
  const pdf = S.reports.find((r) => r.name === 'perf-strategy.pdf');
  return head('Strategy', `${esc(s.mode)} analysis · ${esc(s.date)}`, pdf ? `<a class="btn" href="/files/reports/perf-strategy.pdf" target="_blank">Open PDF</a>` : '') +
    `<div class="card"><h3>Summary</h3><p style="margin:6px 0 0;max-width:90ch">${esc(s.executiveSummary)}</p></div>` +
    `<div class="grid cols2" style="margin-top:14px"><div class="card"><h3>Service level objectives</h3><div class="hint">What “good” means for this system.</div><table><tbody>${(s.slos || []).map((x) => `<tr><td>${esc(x.metric)}</td><td style="white-space:nowrap"><b>${esc(x.target)}</b></td></tr>`).join('')}</tbody></table></div>` +
    `<div class="card"><h3>Test plan</h3><div class="hint">Executed in order, one at a time.</div><table><tbody>${(s.testPlan || []).map((x) => `<tr><td><b>${esc(x.profile)}</b><div class="sub">${esc(x.purpose)}</div></td><td style="white-space:nowrap">${esc(x.load)}<div class="sub">${esc(x.duration)}</div></td></tr>`).join('')}</tbody></table></div></div>` +
    `<div class="card" style="margin-top:14px"><h3>Findings from code review</h3><div class="hint">Evidence-based risks that drove the plan.</div>${(s.findings || []).map((f) => `<div class="finding"><div class="area">${esc(f.area)} ${f.perfRisk ? `<span class="pill ${/high/i.test(f.perfRisk) ? 'bad' : /med/i.test(f.perfRisk) ? 'warn' : ''}">${esc(f.perfRisk)}</span>` : ''}</div><div>${esc(f.observation)}</div><div class="ev mono">${esc(f.evidence)}</div></div>`).join('')}</div>` +
    `<div class="grid cols2" style="margin-top:14px"><div class="card"><h3>Open questions</h3><ul style="padding-left:18px;margin:6px 0">${(s.openQuestions || []).map((q) => `<li>${esc(q)}</li>`).join('')}</ul></div><div class="card"><h3>Out of scope</h3><ul style="padding-left:18px;margin:6px 0">${(s.notInScope || []).map((q) => `<li>${esc(q)}</li>`).join('')}</ul></div></div>`;
}

let pdfShown = null;
function reports() {
  const pdfs = S.reports.filter((r) => r.name.endsWith('.pdf'));
  pdfShown = pdfShown && pdfs.find((p) => p.name === pdfShown) ? pdfShown : pdfs[0]?.name;
  return head('Reports', 'Generated documents', `<a class="btn" data-go="run">Regenerate</a>`) +
    `<div class="grid cols2"><div class="card"><h3>Files</h3><table><tbody>${S.reports.filter((r) => !r.name.endsWith('.html')).map((r) => `<tr class="${r.name.endsWith('.pdf') ? 'click' : ''}" data-pdf="${esc(r.name)}"><td><b>${esc(r.name)}</b><div class="sub">${when(r.at)} · ${r.kb} KB</div></td><td class="num"><a href="/files/reports/${esc(r.name)}" target="_blank">Open</a></td></tr>`).join('') || '<tr><td>No reports yet.</td></tr>'}</tbody></table></div>` +
    `<div class="card"><h3>Analysis</h3>${S.analysis ? `<div class="md">${md(S.analysis)}</div>` : '<div class="empty">analysis.md not written yet.</div>'}</div></div>` +
    (pdfShown ? `<div class="card" style="margin-top:14px"><h3>${esc(pdfShown)}</h3><iframe class="pdf" title="${esc(pdfShown)}" src="/files/reports/${esc(pdfShown)}"></iframe></div>` : '');
}

function run() {
  const j = S.job, running = j?.running;
  const heavy = S.config.allowRemote ? '' : '';
  const btn = (name, label, desc, primary) => `<div class="card" style="display:flex;flex-direction:column;gap:6px"><b>${label}</b><div class="sub" style="flex:1">${desc}</div><button class="btn ${primary ? 'primary' : ''}" data-run="${name}" ${running ? 'disabled' : ''}>${ico('run')}Run</button></div>`;
  return head('Run', 'Tests run one at a time against the configured target', running ? `<button class="btn" id="cancel">Stop</button>` : '') +
    `<div class="callout">Target: <span class="mono">${esc(target())}</span>. ${/localhost|127\.0\.0\.1/.test(target()) ? 'Local only; the host guard refuses anything else not allow-listed.' : 'Remote target: only allow-listed hosts run, never production.'} Make sure the app is being served (<span class="mono">npm run serve</span>).</div>` +
    `<div class="grid kpis">${btn('smoke', 'Smoke', '1 user, 30 s. Proves the harness works.', 1)}${btn('load', 'Load', 'Ramp to target users, hold 2 min.')}${btn('stress', 'Stress', 'Step up until it breaks (local only).')}${btn('spike', 'Spike', 'Sudden 5x surge, then recovery.')}${btn('browser', 'Browser suite', 'Cold load, data scale and storage limit (Playwright). Several minutes.')}${btn('compare', 'Compare to baseline', 'Flag regressions beyond tolerance.')}${btn('baseline', 'Accept baseline', 'Store latest results as the reference.')}${btn('report', 'Build results PDF', 'Writes reports/perf-report-latest.pdf.')}</div>` +
    `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Console ${j ? `· ${esc(j.label)}` : ''}</h3>${j ? (running ? '<span class="pill warn"><span class="dot"></span>Running</span>' : badge(j.code === 0, 'Finished', 'Exit ' + j.code)) : ''}</div><div class="console" id="console">${esc(consoleLines.join('\n')) || 'Output appears here.'}</div></div>`;
}

// ---------- tiny markdown ----------
function md(src) {
  const inl = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let out = '', list = false;
  for (const raw of src.split('\n')) {
    const l = raw.trimEnd();
    const li = /^\s*[-*]\s+(.*)/.exec(l);
    if (li) { if (!list) { out += '<ul style="padding-left:18px">'; list = true; } out += `<li>${inl(li[1])}</li>`; continue; }
    if (list) { out += '</ul>'; list = false; }
    const h = /^(#{1,3})\s+(.*)/.exec(l);
    out += h ? `<h${h[1].length + 1}>${inl(h[2])}</h${h[1].length + 1}>` : l ? `<p>${inl(l)}</p>` : '';
  }
  return out + (list ? '</ul>' : '');
}

// ---------- wiring ----------
function after() {
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { tab = b.dataset.go; location.hash = tab; render(); });
  document.querySelectorAll('[data-sel]').forEach((r) => r.onclick = () => { sel = r.dataset.sel; render(); });
  document.querySelectorAll('[data-pdf]').forEach((r) => r.onclick = (e) => { if (e.target.tagName === 'A') return; if (r.dataset.pdf.endsWith('.pdf')) { pdfShown = r.dataset.pdf; render(); } });
  document.querySelectorAll('[data-run]').forEach((b) => b.onclick = async () => {
    consoleLines = [];
    const r = await fetch('/api/run', { method: 'POST', body: JSON.stringify({ name: b.dataset.run }) });
    if (!r.ok) { consoleLines = [(await r.json()).error]; }
    await load();
  });
  const c = $('#cancel'); if (c) c.onclick = () => fetch('/api/cancel', { method: 'POST' });
  const con = $('#console'); if (con) con.scrollTop = con.scrollHeight;
}
const tip = $('#tip');
document.addEventListener('mousemove', (e) => { const t = e.target.closest?.('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px'; });
$('#theme').onclick = () => { const d = document.documentElement; const dark = d.dataset.theme ? d.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; d.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('perf-theme', d.dataset.theme); } catch {} };
try { const t = localStorage.getItem('perf-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

const es = new EventSource('/api/stream');
es.addEventListener('log', (e) => { consoleLines.push(JSON.parse(e.data)); const c = $('#console'); if (c) { c.textContent = consoleLines.join('\n'); c.scrollTop = c.scrollHeight; } });
es.addEventListener('start', () => load());
es.addEventListener('done', () => load());
window.addEventListener('hashchange', () => { tab = location.hash.slice(1) || 'overview'; render(); });
load();
</script>
